name: Publish

on:
  push:
    branches:
      - dev

# id-token: write enables npm Trusted Publishing (OIDC) — no NPM_PUBLISH
# secret. Each package's Trusted Publisher is configured on npmjs.com:
# GitHub Actions -> Brewskey/spark-server -> publish.yml.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url here: it writes an .npmrc _authToken placeholder,
      # which suppresses npm's OIDC token exchange (trusted publishing).
      # Both packages pin the registry via publishConfig instead.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build
        run: npm run build:all

      - name: Lint packages
        run: npm run lint:check:deps

      - name: Lint spark-server
        run: npm run lint:check

      - name: Test
        run: npm run test:all

      # Trusted publishing needs npm >= 11.5.1 (node 20 ships npm 10).
      # Pinned to 11: npm 12 requires node >= 22.
      - name: Update npm for trusted publishing
        run: npm install -g npm@11

      # Publishes each package unless that name@version is already on the
      # registry (the skip behavior the old JS-DevTools/npm-publish action
      # provided — the action itself can't do tokenless OIDC publishing).
      - name: Publish packages
        run: |
          npm --version
          echo "OIDC env present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          for dir in packages/spark-protocol .; do
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            if [ "$(npm view "${name}@${version}" version 2>/dev/null || true)" = "${version}" ]; then
              echo "${name}@${version} is already published — skipping."
              continue
            fi
            echo "Publishing ${name}@${version}..."
            (cd "${dir}" && npm publish --loglevel http)
          done
